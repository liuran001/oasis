name: Build OpenWrt packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGES: >-
    oasis
    luci-app-oasis
    oasis-mod-tool
    oasis-mod-agent
    oasis-mod-retired
    oasis-mod-spring
    oasis-tool-edge
    oasis-tool-maker
    oasis-mod-test
    luci-i18n-oasis-ja
    luci-i18n-oasis-zh-cn

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 gettext binutils tar

      - name: Audit Japanese and Simplified Chinese catalogs
        run: node dev_tools/check_i18n.cjs

      - name: Run JavaScript tests
        run: |
          for test_file in dev_tools/tests/test_*.cjs; do
            node "$test_file"
          done

      - name: Run portable Lua tests
        run: OASIS_TEST_LUA=lua5.1 ./oasis-mod-test/run_host_tests

      - name: Run Python tests
        run: python3 -B -m unittest discover -s dev_tools/tests -p 'test_*.py'

  build:
    name: ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    needs: host-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: x86_64-24.10.8
            arch: x86_64
            format: ipk
            artifact: oasis-ipk-24.10.8-x86_64
          - sdk: aarch64_generic-24.10.8
            arch: aarch64_generic
            format: ipk
            artifact: oasis-ipk-24.10.8-arm64
          - sdk: arm_cortex-a15_neon-vfpv4-24.10.8
            arch: arm_cortex-a15_neon-vfpv4
            format: ipk
            artifact: oasis-ipk-24.10.8-arm32
          - sdk: mipsel_24kc-24.10.8
            arch: mipsel_24kc
            format: ipk
            artifact: oasis-ipk-24.10.8-mipsle
          - sdk: x86_64-25.12.5
            arch: x86_64
            format: apk
            artifact: oasis-apk-25.12.5-x86_64
          - sdk: aarch64_generic-25.12.5
            arch: aarch64_generic
            format: apk
            artifact: oasis-apk-25.12.5-arm64
          - sdk: arm_cortex-a15_neon-vfpv4-25.12.5
            arch: arm_cortex-a15_neon-vfpv4
            format: apk
            artifact: oasis-apk-25.12.5-arm32
          - sdk: mipsel_24kc-25.12.5
            arch: mipsel_24kc
            format: apk
            artifact: oasis-apk-25.12.5-mipsle

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare artifact directory
        run: mkdir -p out

      - name: Build packages with the official OpenWrt SDK
        uses: openwrt/gh-action-sdk@f5813d30eeef3534b58ac7e79c5d8842b6035434
        env:
          ARCH: ${{ matrix.sdk }}
          FEEDNAME: oasis
          PACKAGES: ${{ env.PACKAGES }}
          ARTIFACTS_DIR: ${{ github.workspace }}/out
          BUILD_LOG: 1

      - name: Verify package completeness and Chinese LMO
        shell: bash
        run: |
          directory="out/bin/packages/${{ matrix.arch }}/oasis"
          sh dev_tools/verify_packages.sh "$directory" "${{ matrix.format }}" $PACKAGES

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/bin/packages/${{ matrix.arch }}/oasis/*.${{ matrix.format }}
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-logs
          path: out/logs/
          if-no-files-found: ignore

  release:
    name: Publish tagged release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create one archive per architecture and format
        shell: bash
        run: |
          mkdir -p dist
          for directory in release/*; do
            name=$(basename "$directory")
            tar -czf "dist/${name}.tar.gz" -C "$directory" .
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
