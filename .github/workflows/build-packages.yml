name: Build OpenWrt packages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGES: >-
    oasis
    luci-app-oasis
    oasis-mod-tool
    oasis-mod-agent
    oasis-mod-retired
    oasis-mod-spring
    oasis-tool-edge
    oasis-tool-maker
    oasis-mod-test
    luci-i18n-oasis-ja
    luci-i18n-oasis-zh-cn

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 gettext binutils tar

      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/oasis-tests" --no-save --no-package-lock playwright@1.65.0
          "$RUNNER_TEMP/oasis-tests/node_modules/.bin/playwright" install --with-deps chromium

      - name: Audit Japanese and Simplified Chinese catalogs
        run: node dev_tools/check_i18n.cjs

      - name: Run JavaScript tests
        env:
          NODE_PATH: ${{ runner.temp }}/oasis-tests/node_modules
        run: |
          for test_file in dev_tools/tests/test_*.cjs; do
            node "$test_file"
          done

      - name: Run portable Lua tests
        run: OASIS_TEST_LUA=lua5.1 ./oasis-mod-test/run_host_tests

      - name: Run Python tests
        run: python3 -B -m unittest discover -s dev_tools/tests -p 'test_*.py'

  build:
    name: ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    needs: host-tests
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: x86_64-24.10.8
            version: 24.10.8
            target: x86
            subtarget: "64"
            arch: x86_64
            format: ipk
            artifact: oasis-ipk-24.10.8-x86_64
          - sdk: aarch64_generic-24.10.8
            version: 24.10.8
            target: armsr
            subtarget: armv8
            arch: aarch64_generic
            format: ipk
            artifact: oasis-ipk-24.10.8-arm64
          - sdk: arm_cortex-a15_neon-vfpv4-24.10.8
            version: 24.10.8
            target: armsr
            subtarget: armv7
            arch: arm_cortex-a15_neon-vfpv4
            format: ipk
            artifact: oasis-ipk-24.10.8-arm32
          - sdk: mipsel_24kc-24.10.8
            version: 24.10.8
            target: ramips
            subtarget: mt7621
            arch: mipsel_24kc
            format: ipk
            artifact: oasis-ipk-24.10.8-mipsle
          - sdk: x86_64-25.12.5
            version: 25.12.5
            target: x86
            subtarget: "64"
            arch: x86_64
            format: apk
            artifact: oasis-apk-25.12.5-x86_64
          - sdk: aarch64_generic-25.12.5
            version: 25.12.5
            target: armsr
            subtarget: armv8
            arch: aarch64_generic
            format: apk
            artifact: oasis-apk-25.12.5-arm64
          - sdk: arm_cortex-a15_neon-vfpv4-25.12.5
            version: 25.12.5
            target: armsr
            subtarget: armv7
            arch: arm_cortex-a15_neon-vfpv4
            format: apk
            artifact: oasis-apk-25.12.5-arm32
          - sdk: mipsel_24kc-25.12.5
            version: 25.12.5
            target: ramips
            subtarget: mt7621
            arch: mipsel_24kc
            format: apk
            artifact: oasis-apk-25.12.5-mipsle

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install SDK extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zstd

      - name: Cache official SDK archives
        uses: actions/cache@v4
        with:
          path: .sdk-cache
          key: openwrt-sdk-${{ matrix.sdk }}

      - name: Build with a prebuilt official SDK archive
        env:
          PACKAGES: ${{ env.PACKAGES }}
          OASIS_SDK_CACHE: ${{ github.workspace }}/.sdk-cache
          BUILD_LOG: 1
        run: |
          sh dev_tools/build_openwrt_packages.sh \
            "${{ matrix.version }}" \
            "${{ matrix.target }}" \
            "${{ matrix.subtarget }}" \
            "${{ matrix.arch }}" \
            "${{ matrix.format }}" \
            "work"

      - name: Verify package completeness and Chinese LMO
        shell: bash
        run: sh dev_tools/verify_packages.sh "work/out" "${{ matrix.format }}" $PACKAGES

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: work/out/*.${{ matrix.format }}
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-logs
          path: work/sdk/**/logs/
          if-no-files-found: ignore

  release:
    name: Publish tagged release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all architecture artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create one archive per architecture and format
        shell: bash
        run: |
          mkdir -p dist
          for directory in release/*; do
            name=$(basename "$directory")
            tar -czf "dist/${name}.tar.gz" -C "$directory" .
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.tar.gz
